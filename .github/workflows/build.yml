name: Build Geode Mod

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Install dependencies
      run: |
        brew install cmake ninja
    
    - name: Clone Geode SDK
      run: |
        git clone --depth 1 https://github.com/geode-sdk/geode.git $HOME/geode-sdk
        echo "GEODE_SDK=$HOME/geode-sdk" >> $GITHUB_ENV
    
    - name: Setup Geode CLI
      run: |
        cd $HOME/geode-sdk
        mkdir -p build
        cd build
        cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build . --target geode-cli
        echo "$HOME/geode-sdk/build/bin" >> $GITHUB_PATH
    
    - name: Install Geode Binaries
      run: |
        geode sdk install-binaries
    
    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DGEODE_SDK=$GEODE_SDK
    
    - name: Build
      run: cmake --build build --config Release
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: BotAutoPlay-iOS
        path: build/*.geode
        if-no-files-found: error
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: build/*.geode
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}